<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <title>My Project</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"></a>
                <img src="img/brandred.png" class="logo" alt="Logo">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
                </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item me-2">
                <a class="nav-link active" aria-current="page" href="#" style="font-weight: bold; font-size: 15px;">Home</a>
                </li>
                <li class="nav-item me-3">
                <a class="nav-link" href="#" style="font-weight: bold; font-size: 15px;">My Project</a>
                </li>
            </ul>
            <form class="d-flex" role="search">
            <button class="button" type="submit">Contact Me</button>
            </form>
            </div>
        </div>
        </nav>

    <div class="form-container">
        <h1>ADD MY PROJECT</h1>
        <form onsubmit="getData(event)">
            <div class="form-group">
                <label for="projectName">Project Name</label>
                <input type="text" class="form-control" id="projectName" required>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="startDate">Start Date</label>
                    <input type="date" class="form-control" id="startDate" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="endDate">End Date</label>
                    <input type="date" class="form-control" id="endDate" required>
                </div>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea class="form-control" id="description" rows="3" required></textarea>
            </div>
            <label>Technologies</label>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <div class="form-check">
                        <input class="mycheckbox" type="checkbox" id="nodeJs">
                        <label class="form-check-label" for="nodeJs">Node Js</label>
                    </div>
                    <div class="form-check">
                        <input class="mycheckbox" type="checkbox" id="reactJs">
                        <label class="form-check-label" for="reactJs">React Js</label>
                    </div>
                </div>
                <div class="form-group col-md-6">
                    <div class="form-check">
                        <input class="mycheckbox" type="checkbox" id="nextJs">
                        <label class="form-check-label" for="nextJs">Next Js</label>
                    </div>
                    <div class="form-check">
                        <input class="mycheckbox" type="checkbox" id="typescript">
                        <label class="form-check-label" for="typescript">TypeScript</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="uploadImage">Upload Image</label>
                <input type="file" class="form-control-file" id="uploadImage">
            </div>
            <button type="submit" class="btn btn-submit">submit</button>
        </form>
    </div>

    <div class="header mt-5">
        <h2>MY PROJECT</h2>
    </div>

    <div id ="flexbox">
        <div class="col-md-3 project-card">
            <div id="card">
                </div>
            </div>
        </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.0.11/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
